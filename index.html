<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>整數大決鬥 V1.2.1 - 七年級數學對戰</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap');
    
    * {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Screen Shake Animation */
    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Attack Dash Animation */
    .dash-right {
      animation: dashRight 0.4s ease-in-out;
    }
    @keyframes dashRight {
      0% { transform: translateX(0); }
      50% { transform: translateX(80px) scale(1.1); }
      100% { transform: translateX(0); }
    }

    .dash-left {
      animation: dashLeft 0.4s ease-in-out;
    }
    @keyframes dashLeft {
      0% { transform: translateX(0); }
      50% { transform: translateX(-80px) scale(1.1); }
      100% { transform: translateX(0); }
    }

    /* Floating Feedback Text */
    .floating-text {
      position: absolute;
      font-weight: 900;
      font-size: 2rem;
      animation: floatUp 0.8s ease-out forwards;
      pointer-events: none;
      z-index: 60;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      50% { transform: translateY(-30px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-60px) scale(1); }
    }

    /* Orientation Overlay for Mobile Portrait */
    #orientation-overlay {
      display: none;
    }
    @media screen and (max-width: 900px) and (orientation: portrait) {
      #orientation-overlay {
        display: flex !important;
      }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4 relative">

  <!-- Version Tag on Top Left -->

    <div id="toast-container" class="absolute top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-full max-w-md px-4 flex flex-col items-center gap-2"></div>

    <!-- SCREEN 1: LOGIN / START SCREEN -->
    <section id="screen-login" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
      <div class="inline-block p-4 bg-indigo-500/10 rounded-full mb-4 border border-indigo-500/20">

      <p class="text-slate-400 text-sm sm:text-base mb-8">七年級數學：正負整數加減法即時對戰</p>

    <!-- SCREEN 3: WAITING ROOM SCREEN -->
    <section id="screen-waiting" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center">
      <div class="relative mb-6">

      <!-- Battle HUD -->

      <!-- Question Card Container -->

    <!-- SCREEN 5: GAME OVER OVERLAY -->

      <button id="btn-return-lobby" class="px-8 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg transition active:scale-95">
        回到遊戲大廳
      </button>

  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // =========================================================================
    // 1. SUPABASE CONNECTION CONFIGURATION
    // =========================================================================
    const SUPABASE_URL = 'https://utcbxqhqgbkaoavfrnbe.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_5azc7FOASCij4AiiUAeudw_GlREosPc';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      realtime: { params: { eventsPerSecond: 10 } }
    });

    // =========================================================================
    // 2. GLOBAL GAME STATE VARIABLES
    // =========================================================================
    const AVATARS = ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐧', '🐸'];
    
    let clientToken = localStorage.getItem('sequence_battle_client_token');
    if (!clientToken) {
      clientToken = crypto.randomUUID();
      localStorage.setItem('sequence_battle_client_token', clientToken);
    }

    let nickname = '';
    let currentScreen = 'login';
    let currentRoomId = null;
    let currentSeat = null; // 1 or 2
    let currentQuestion = null;
    
    // Direct Realtime HP Tracker
    let myHp = 7;
    let opponentHp = 7;
    
    let lobbyChannel = null;
    let gameChannel = null;
    
    let heartbeatTimer = null;
    let disconnectTimer = null;
    let opponentWasPresent = false;

    // =========================================================================
    // 3. UI ELEMENT REFERENCES
    // =========================================================================
    const screens = {
      login: document.getElementById('screen-login'),
      lobby: document.getElementById('screen-lobby'),
      waiting: document.getElementById('screen-waiting'),
      battle: document.getElementById('screen-battle')
    };

    const nicknameInput = document.getElementById('nickname-input');
    const dbStatusDot = document.getElementById('db-status-dot');
    const dbStatusText = document.getElementById('db-status-text');
    const roomListContainer = document.getElementById('room-list-container');
    const noRoomsNotice = document.getElementById('no-rooms-notice');
    
    const p1Avatar = document.getElementById('p1-avatar');
    const p1Name = document.getElementById('p1-name');
    const p1HpBar = document.getElementById('p1-hp-bar');
    const p1HpText = document.getElementById('p1-hp-text');

    const p2Avatar = document.getElementById('p2-avatar');
    const p2Name = document.getElementById('p2-name');
    const p2HpBar = document.getElementById('p2-hp-bar');
    const p2HpText = document.getElementById('p2-hp-text');

    const questionText = document.getElementById('question-text');
    const optionBtns = document.querySelectorAll('.btn-option');
    const resultModal = document.getElementById('modal-result');

    // =========================================================================
    // 4. RANDOM QUESTION GENERATOR
    // =========================================================================
    function generateMathQuestion() {
      const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      
      let a = getRandomInt(-15, 15);
      let b = getRandomInt(-15, 15);
      while (a === 0) a = getRandomInt(-15, 15);
      while (b === 0) b = getRandomInt(-15, 15);

      const isAddition = Math.random() > 0.5;
      const opSymbol = isAddition ? '+' : '-';
      
      const formatNum = (num) => num < 0 ? `(${num})` : `${num}`;
      const qText = `${formatNum(a)} ${opSymbol} ${formatNum(b)} = ?`;
      
      const correctAnswer = isAddition ? (a + b) : (a - b);
      
      const optionsSet = new Set([correctAnswer]);
      while (optionsSet.size < 4) {
        let fake = correctAnswer + getRandomInt(-5, 5);
        if (fake !== correctAnswer) optionsSet.add(fake);
      }

      const options = Array.from(optionsSet).sort(() => Math.random() - 0.5);

      return {
        text: qText,
        options: options,
        correctIndex: options.indexOf(correctAnswer)
      };
    }

    function renderNextQuestion() {
      currentQuestion = generateMathQuestion();
      questionText.innerText = currentQuestion.text;

      optionBtns.forEach((btn, idx) => {
        const labels = ['A', 'B', 'C', 'D'];
        btn.innerText = `${labels[idx]}. ${currentQuestion.options[idx]}`;
        btn.disabled = false;
        btn.className = "btn-option p-3 sm:py-4 bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 border border-slate-700 rounded-xl font-black text-lg sm:text-xl text-white transition duration-100 flex items-center justify-center";
      });
    }

    // =========================================================================
    // 5. NAVIGATION & UI HELPER
    // =========================================================================
    function showScreen(screenName) {
      currentScreen = screenName;
      Object.keys(screens).forEach(key => {
        if (key === screenName) {
          screens[key].classList.remove('hidden');
        } else {
          screens[key].classList.add('hidden');
        }
      });
      if (screenName !== 'battle') {
        resultModal.classList.add('hidden');
      }
    }

    function showToast(msg, isError = false) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `px-4 py-2.5 rounded-xl text-sm font-bold shadow-lg transition duration-300 transform translate-y-[-10px] opacity-0 flex items-center gap-2 ${
        isError ? 'bg-rose-600 text-white' : 'bg-indigo-600 text-white'
      }`;
      toast.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-info'}"></i><span>${msg}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-[-10px]', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function updateHpUI() {
      p1HpBar.style.width = `${Math.max(0, (myHp / 7) * 100)}%`;
      p1HpText.innerText = `${myHp} HP`;
      p2HpBar.style.width = `${Math.max(0, (opponentHp / 7) * 100)}%`;
      p2HpText.innerText = `${opponentHp} HP`;
    }

    // =========================================================================
    // 6. INITIALIZATION & DATABASE CHECK
    // =========================================================================
    async function initDatabase() {
      try {
        const { error } = await supabaseClient.from('rooms').select('id').limit(1);
        if (error && error.code !== 'PGRST116') throw error;
        
        dbStatusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
        dbStatusText.innerText = "資料庫已連接";
        dbStatusText.className = "text-emerald-400 font-bold";
      } catch (err) {
        console.error("Database connection error:", err);
        dbStatusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
        dbStatusText.innerText = "資料庫連線異常";
        dbStatusText.className = "text-rose-400 font-bold";
      }
    }

    // =========================================================================
    // 7. LOBBY & ROOM MANAGEMENT
    // =========================================================================
    async function fetchLiveRooms() {
      try {
        const { data, error } = await supabaseClient.rpc('list_live_rooms');
        if (error) throw error;
        renderRoomList(data || []);
      } catch (err) {
        console.error("Error fetching live rooms:", err);
      }
    }

    function renderRoomList(rooms) {
      roomListContainer.innerHTML = '';
      if (!rooms || rooms.length === 0) {
        noRoomsNotice.classList.remove('hidden');
        return;
      }

      noRoomsNotice.classList.add('hidden');
      rooms.forEach(room => {
        const card = document.createElement('div');
        card.className = "p-4 bg-slate-800/80 border border-slate-700/80 rounded-2xl flex items-center justify-between shadow-md hover:border-indigo-500/50 transition";
        card.innerHTML = `
          <div>
            <div class="font-black text-white text-base">${escapeHtml(room.host_nickname)} 的對戰房</div>
            <div class="text-xs text-slate-400 mt-0.5">狀態: 等待中...</div>
          </div>
          <button onclick="handleJoinRoomAttempt('${room.id}')" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 active:scale-95 text-white font-bold rounded-xl text-xs shadow transition">
            加入對戰
          </button>
        `;
        roomListContainer.appendChild(card);
      });
    }

    function subscribeLobbyRealtime() {
      if (lobbyChannel) supabaseClient.removeChannel(lobbyChannel);
      lobbyChannel = supabaseClient.channel('public:rooms')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => {
          if (currentScreen === 'lobby') fetchLiveRooms();
        })
        .subscribe();
    }

    // =========================================================================
    // 8. ROOM CREATION & HEARTBEAT
    // =========================================================================
    async function handleCreateRoom() {
      try {
        const { data, error } = await supabaseClient.rpc('create_room', {
          p_nickname: nickname,
          p_client_token: clientToken
        });

        if (error) throw error;

        currentRoomId = data.room_id;
        currentSeat = 1;

        showScreen('waiting');
        startHeartbeat();
        subscribeGameChannel();

      } catch (err) {
        console.error("Create room failed:", err);
        showToast("建立房間失敗，請重試", true);
      }
    }

    function startHeartbeat() {
      stopHeartbeat();
      heartbeatTimer = setInterval(async () => {
        if (currentScreen === 'waiting' && currentSeat === 1 && currentRoomId) {
          await supabaseClient.rpc('heartbeat_room', {
            p_room_id: currentRoomId,
            p_client_token: clientToken
          });
        } else {
          stopHeartbeat();
        }
      }, 3000);
    }

    function stopHeartbeat() {
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
    }

    async function handleCancelRoom() {
      if (currentRoomId) {
        try {
          await supabaseClient.rpc('cancel_room', {
            p_room_id: currentRoomId,
            p_client_token: clientToken
          });
        } catch (err) {
          console.error("Cancel room RPC error:", err);
        }
      }
      cleanupRoomState();
      showScreen('lobby');
      fetchLiveRooms();
    }

    // =========================================================================
    // 9. JOIN ROOM PROBE & HANDSHAKE
    // =========================================================================
    async function handleJoinRoomAttempt(targetRoomId) {
      const probeId = crypto.randomUUID();
      let hostAckReceived = false;

      const tempChannel = supabaseClient.channel(`game-${targetRoomId}`);

      tempChannel
        .on('broadcast', { event: 'host_ack' }, (payload) => {
          if (payload.payload.probe_id === probeId) {
            hostAckReceived = true;
          }
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            tempChannel.send({
              type: 'broadcast',
              event: 'join_probe',
              payload: { probe_id: probeId }
            });

            setTimeout(async () => {
              supabaseClient.removeChannel(tempChannel);

              if (hostAckReceived) {
                try {
                  const { data, error } = await supabaseClient.rpc('join_room', {
                    p_room_id: targetRoomId,
                    p_nickname: nickname,
                    p_client_token: clientToken
                  });

                  if (error) throw error;

                  currentRoomId = targetRoomId;
                  currentSeat = 2;

                  subscribeGameChannel();

                } catch (err) {
                  console.error("Join room failed:", err);
                  showToast(err.message === 'HOST_OFFLINE' ? "房主已離開，請選其他房間。" : "無法加入房間", true);
                  fetchLiveRooms();
                }
              } else {
                showToast("房主已離開，請選其他房間。", true);
                fetchLiveRooms();
              }
            }, 1800);
          }
        });
    }

    // =========================================================================
    // 10. REALTIME GAME CHANNEL (V1.2.1 REFACTORED FOR FULL HANDSHAKE)
    // =========================================================================
    function subscribeGameChannel() {
      if (gameChannel) supabaseClient.removeChannel(gameChannel);

      gameChannel = supabaseClient.channel(`game-${currentRoomId}`, {
        config: { presence: { key: clientToken } }
      });

      opponentWasPresent = false;

      gameChannel
        .on('broadcast', { event: 'join_probe' }, (payload) => {
          if (currentScreen === 'waiting' && currentSeat === 1) {
            gameChannel.send({
              type: 'broadcast',
              event: 'host_ack',
              payload: { probe_id: payload.payload.probe_id }
            });
          }
        })
        .on('broadcast', { event: 'player_joined' }, () => {
          // Player 2 joined signal -> Host triggers game start for everyone
          if (currentSeat === 1) {
            gameChannel.send({
              type: 'broadcast',
              event: 'game_start',
              payload: {}
            });
            if (currentScreen !== 'battle') {
              stopHeartbeat();
              startBattle();
            }
          }
        })
        .on('broadcast', { event: 'game_start' }, () => {
          // Game start command received by both players
          if (currentScreen !== 'battle') {
            stopHeartbeat();
            startBattle();
          }
        })
        .on('broadcast', { event: 'action_event' }, (payload) => {
          const evt = payload.payload;
          if (evt.senderSeat !== currentSeat) {
            handleOpponentAction(evt);
          }
        })
        .on('presence', { event: 'sync' }, () => {
          const state = gameChannel.presenceState();
          const presentTokens = Object.keys(state);
          const opponentPresent = presentTokens.some(token => token !== clientToken);

          if (opponentPresent) {
            opponentWasPresent = true;
            if (disconnectTimer) {
              clearTimeout(disconnectTimer);
              disconnectTimer = null;
            }
            if (currentScreen === 'waiting') {
              stopHeartbeat();
              startBattle();
            }
          } else if (opponentWasPresent && !disconnectTimer && currentScreen === 'battle') {
            disconnectTimer = setTimeout(() => {
              if (currentScreen === 'battle') {
                showToast("對手已斷線", true);
                renderGameOverUI(true);
              }
            }, 5000);
          }
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await gameChannel.track({ seat: currentSeat, nickname: nickname });

            // Player 2 broadcasts join notification upon channel subscription
            if (currentSeat === 2) {
              gameChannel.send({
                type: 'broadcast',
                event: 'player_joined',
                payload: { seat: 2 }
              });
              // Immediate fallback to start battle
              setTimeout(() => {
                if (currentScreen !== 'battle') {
                  startBattle();
                }
              }, 500);
            }
          }
        });
    }

    // =========================================================================
    // 11. BATTLE ENGINE (REALTIME SYNC)
    // =========================================================================
    function startBattle() {
      myHp = 7;
      opponentHp = 7;
      
      showScreen('battle');

      const seed = currentRoomId.replace(/-/g, '');
      const num1 = parseInt(seed.substring(0, 4), 16) % AVATARS.length;
      let num2 = parseInt(seed.substring(4, 8), 16) % AVATARS.length;
      if (num1 === num2) num2 = (num2 + 1) % AVATARS.length;

      const p1Emoji = AVATARS[num1];
      const p2Emoji = AVATARS[num2];

      if (currentSeat === 1) {
        p1Avatar.innerText = p1Emoji;
        p1Name.innerText = `${nickname} (我方)`;
        p2Avatar.innerText = p2Emoji;
        p2Name.innerText = `對手`;
      } else {
        p1Avatar.innerText = p2Emoji;
        p1Name.innerText = `${nickname} (我方)`;
        p2Avatar.innerText = p1Emoji;
        p2Name.innerText = `對手`;
      }

      updateHpUI();
      renderNextQuestion();
    }

    async function submitAnswer(isCorrect, selectedBtn) {
      optionBtns.forEach(btn => btn.disabled = true);

      if (isCorrect) {
        selectedBtn.className = "btn-option p-3 sm:py-4 bg-emerald-600 border border-emerald-400 rounded-xl font-black text-lg sm:text-xl text-white flex items-center justify-center";
        showFloatingText("答對！攻擊！💥", selectedBtn, "text-emerald-400");
        
        // Correct Answer: Deduct opponent HP by 1
        opponentHp = Math.max(0, opponentHp - 1);
        updateHpUI();
        triggerAttackAnimation(true, 'hit');

        // Broadcast to opponent
        gameChannel.send({
          type: 'broadcast',
          event: 'action_event',
          payload: { senderSeat: currentSeat, type: 'attack', targetHp: opponentHp }
        });

      } else {
        selectedBtn.className = "btn-option p-3 sm:py-4 bg-rose-600 border border-rose-400 rounded-xl font-black text-lg sm:text-xl text-white flex items-center justify-center";
        showFloatingText("答錯！扣 1 HP", selectedBtn, "text-rose-400");

        // Wrong Answer: Deduct my own HP by 1
        myHp = Math.max(0, myHp - 1);
        updateHpUI();
        triggerAttackAnimation(false, 'self_hit');

        // Broadcast to opponent
        gameChannel.send({
          type: 'broadcast',
          event: 'action_event',
          payload: { senderSeat: currentSeat, type: 'self_damage', myRemainingHp: myHp }
        });
      }

      // Check Win / Lose Conditions
      if (opponentHp <= 0) {
        setTimeout(() => renderGameOverUI(true), 600);
        return;
      } else if (myHp <= 0) {
        setTimeout(() => renderGameOverUI(false), 600);
        return;
      }

      setTimeout(() => {
        if (currentScreen === 'battle') {
          renderNextQuestion();
        }
      }, 900);
    }

    function handleOpponentAction(evt) {
      if (evt.type === 'attack') {
        // Opponent answered correctly -> My HP decreases
        myHp = Math.max(0, evt.targetHp);
        updateHpUI();
        triggerAttackAnimation(false, 'hit');

        if (myHp <= 0) {
          setTimeout(() => renderGameOverUI(false), 600);
        }
      } else if (evt.type === 'self_damage') {
        // Opponent answered wrong -> Opponent HP decreases
        opponentHp = Math.max(0, evt.myRemainingHp);
        updateHpUI();
        triggerAttackAnimation(true, 'self_hit');

        if (opponentHp <= 0) {
          setTimeout(() => renderGameOverUI(true), 600);
        }
      }
    }

    function triggerAttackAnimation(isMyAction, eventType) {
      const attackerAvatar = isMyAction ? p1Avatar : p2Avatar;
      const victimAvatar = isMyAction ? p2Avatar : p1Avatar;

      if (eventType === 'hit') {
        attackerAvatar.classList.add(isMyAction ? 'dash-right' : 'dash-left');
        setTimeout(() => {
          attackerAvatar.classList.remove('dash-right', 'dash-left');
          victimAvatar.classList.add('shake');
          setTimeout(() => victimAvatar.classList.remove('shake'), 500);
        }, 200);
      } else if (eventType === 'self_hit') {
        const targetAvatar = isMyAction ? p1Avatar : p2Avatar;
        targetAvatar.classList.add('shake');
        setTimeout(() => targetAvatar.classList.remove('shake'), 500);
      }
    }

    function showFloatingText(text, element, colorClass) {
      const rect = element.getBoundingClientRect();
      const floatEl = document.createElement('div');
      floatEl.className = `floating-text ${colorClass}`;
      floatEl.innerText = text;
      floatEl.style.left = `${rect.left + rect.width / 2 - 40}px`;
      floatEl.style.top = `${rect.top - 20}px`;
      document.body.appendChild(floatEl);

      setTimeout(() => floatEl.remove(), 800);
    }

    function renderGameOverUI(isWinner) {
      resultModal.classList.remove('hidden');

      const titleEl = document.getElementById('result-title');
      const descEl = document.getElementById('result-desc');
      const iconEl = document.getElementById('result-icon');

      if (isWinner) {
        iconEl.innerText = '🏆';
        titleEl.innerText = '榮耀勝利！';
        titleEl.className = 'text-4xl font-black text-yellow-400 mb-2';
        descEl.innerText = '太棒了！你的正負整數運算技巧獲得了壓倒性的勝利！';
        
        confetti({
          particleCount: 120,
          spread: 70,
          origin: { y: 0.6 }
        });
      } else {
        iconEl.innerText = '💪';
        titleEl.innerText = '再接再厲！';
        titleEl.className = 'text-4xl font-black text-indigo-300 mb-2';
        descEl.innerText = '這次差了一點點，再多練習幾題下次一定能獲得勝利！';
      }
    }

    // =========================================================================
    // 12. STATE CLEANUP & RESET
    // =========================================================================
    function cleanupRoomState() {
      stopHeartbeat();
      if (disconnectTimer) {
        clearTimeout(disconnectTimer);
        disconnectTimer = null;
      }
      if (gameChannel) {
        supabaseClient.removeChannel(gameChannel);
        gameChannel = null;
      }
      currentRoomId = null;
      currentSeat = null;
      opponentWasPresent = false;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    // =========================================================================
    // 13. EVENT LISTENERS
    // =========================================================================
    document.getElementById('btn-enter-lobby').addEventListener('click', () => {
      const val = nicknameInput.value.trim();
      if (!val || val.length < 1 || val.length > 20) {
        showToast("請輸入 1~20 字暱稱", true);
        return;
      }
      nickname = val;
      document.getElementById('lobby-player-name').innerText = nickname;
      showScreen('lobby');
      fetchLiveRooms();
      subscribeLobbyRealtime();
    });

    document.getElementById('btn-create-room').addEventListener('click', handleCreateRoom);
    document.getElementById('btn-cancel-room').addEventListener('click', handleCancelRoom);

    document.getElementById('btn-return-lobby').addEventListener('click', () => {
      cleanupRoomState();
      showScreen('lobby');
      fetchLiveRooms();
    });

    optionBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(e.currentTarget.getAttribute('data-idx'));
        const isCorrect = (idx === currentQuestion.correctIndex);
        submitAnswer(isCorrect, e.currentTarget);
      });
    });

    // Pagehide beacon for room host cancellation
    window.addEventListener('pagehide', () => {
      if (currentScreen === 'waiting' && currentSeat === 1 && currentRoomId) {
        const url = `${SUPABASE_URL}/rest/v1/rpc/cancel_room`;
        const payload = JSON.stringify({
          p_room_id: currentRoomId,
          p_client_token: clientToken
        });
        fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_PUBLISHABLE_KEY,
            'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
          },
          body: payload,
          keepalive: true
        });
      }
    });

    // Start App
    initDatabase();
  </script>
</body>
