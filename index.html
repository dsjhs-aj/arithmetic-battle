<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>整數加減大對決 - 7年級數學對戰</title>
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- MathJax for Math Rendering -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --primary-hover: #357abd;
      --secondary: #ff6b6b;
      --accent: #f5a623;
      --text-main: #333333;
      --text-muted: #666666;
      --border-radius: 12px;
      --box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; }
    
    .watermark { position: fixed; top: 10px; right: 15px; font-size: 0.8rem; color: #888; z-index: 1000; font-weight: bold; }
    
    .screen { display: none; width: 100%; max-width: 800px; background: var(--card-bg); padding: 20px; border-radius: var(--border-radius); box-shadow: var(--box-shadow); text-align: center; }
    .screen.active { display: block; }

    /* Login & Lobby */
    h1 { margin-bottom: 10px; color: var(--primary); }
    .subtitle { color: var(--text-muted); margin-bottom: 20px; }
    input[type="text"] { width: 80%; max-width: 300px; padding: 12px; font-size: 1.1rem; border: 2px solid #ccc; border-radius: 8px; margin-bottom: 15px; outline: none; text-align: center; }
    input[type="text"]:focus { border-color: var(--primary); }
    button { padding: 12px 24px; font-size: 1.1rem; font-weight: bold; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 5px; }
    button:hover { background: var(--primary-hover); }
    button.btn-danger { background: var(--secondary); }
    button.btn-danger:hover { background: #e05252; }
    
    .status-badge { font-size: 0.9rem; margin-top: 15px; padding: 5px 10px; display: inline-block; border-radius: 20px; background: #e2e8f0; }
    .status-badge.connected { background: #e6fffa; color: #234e52; }

    .room-list { margin: 20px 0; max-height: 250px; overflow-y: auto; text-align: left; border: 1px solid #eee; border-radius: 8px; padding: 10px; }
    .room-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .room-item:last-child { border-bottom: none; }

    /* Battle Screen */
    .battle-hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; }
    .player-card { display: flex; flex-direction: column; align-items: center; width: 35%; }
    .avatar { font-size: 3rem; }
    .player-name { font-weight: bold; margin: 5px 0; }
    .hp-bar-bg { width: 100%; height: 16px; background: #e2e8f0; border-radius: 8px; overflow: hidden; margin-top: 5px; }
    .hp-bar-fill { height: 100%; background: #48bb78; transition: width 0.3s ease; }
    .vs-text { font-size: 1.5rem; font-weight: bold; color: var(--secondary); }

    .question-box { font-size: 2rem; margin: 25px 0; min-height: 80px; display: flex; justify-content: center; align-items: center; background: #edf2f7; border-radius: 8px; padding: 10px; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .option-btn { padding: 18px; font-size: 1.3rem; background: white; border: 2px solid var(--primary); color: var(--primary); border-radius: 8px; font-weight: bold; }
    .option-btn:hover { background: var(--primary); color: white; }

    /* Orientation overlay for phones */
    #portrait-overlay { display: none; position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.9); color: white; z-index: 9999; justify-content: center; align-items: center; flex-direction: column; font-size: 1.5rem; }
    @media screen and (max-width: 768px) and (orientation: portrait) {
      #portrait-overlay { display: flex; }
    }

    /* Animations */
    .hit-anim { animation: flashRed 0.3s ease; }
    @keyframes flashRed { 0% { background: rgba(255,0,0,0.4); } 100% { background: var(--card-bg); } }
  </style>
</head>
<body>

  <div class="watermark">你最愛的老師設計</div>

  <div id="portrait-overlay">
    <div>↻ 請將手機轉為橫向以繼續遊戲</div>
  </div>

  <!-- Screen 1: Login -->
  <div id="screen-login" class="screen active">
    <h1>⚔️ 整數加減大對決</h1>
    <p class="subtitle">7年級數學對戰平台</p>
    <div>
      <input type="text" id="input-nickname" placeholder="請輸入暱稱 (1~20字)" maxlength="20"><br>
      <button id="btn-login">進入大廳</button>
    </div>
    <div id="connection-status" class="status-badge">資料庫連線中...</div>
  </div>

  <!-- Screen 2: Lobby -->
  <div id="screen-lobby" class="screen">
    <h2>🎮 遊戲大廳</h2>
    <p>歡迎，<span id="display-nickname" style="font-weight: bold; color: var(--primary);"></span>！</p>
    <div style="margin: 15px 0;">
      <button id="btn-create-room">+ 建立對戰房間</button>
    </div>
    <h3>等待中的房間</h3>
    <div id="room-list" class="room-list">
      <div style="text-align: center; color: #888;">正在載入房間清單...</div>
    </div>
  </div>

  <!-- Screen 3: Waiting Room -->
  <div id="screen-waiting" class="screen">
    <h2>⏳ 等待對手加入...</h2>
    <p style="margin: 20px 0; font-size: 1.2rem;">請稍候，準備戰鬥！</p>
    <button id="btn-cancel-room" class="btn-danger">取消房間</button>
  </div>

  <!-- Screen 4: Battle -->
  <div id="screen-battle" class="screen">
    <div class="battle-hud">
      <div class="player-card">
        <div id="p1-avatar" class="avatar">🐱</div>
        <div id="p1-name" class="player-name">我方</div>
        <div style="font-size:0.8rem; color:#666;">得分: <span id="p1-score">0</span></div>
        <div class="hp-bar-bg"><div id="p1-hp-bar" class="hp-bar-fill" style="width: 100%;"></div></div>
      </div>
      <div class="vs-text">VS</div>
      <div class="player-card">
        <div id="p2-avatar" class="avatar">🐶</div>
        <div id="p2-name" class="player-name">對手</div>
        <div style="font-size:0.8rem; color:#666;">得分: <span id="p2-score">0</span></div>
        <div class="hp-bar-bg"><div id="p2-hp-bar" class="hp-bar-fill" style="width: 100%;"></div></div>
      </div>
    </div>

    <div id="question-box" class="question-box">題目載入中...</div>

    <div class="options-grid">
      <button class="option-btn" onclick="handleAnswer(0)"></button>
      <button class="option-btn" onclick="handleAnswer(1)"></button>
      <button class="option-btn" onclick="handleAnswer(2)"></button>
      <button class="option-btn" onclick="handleAnswer(3)"></button>
    </div>
  </div>

  <!-- Screen 5: Result -->
  <div id="screen-result" class="screen">
    <h1 id="result-title">遊戲結束</h1>
    <div id="result-avatar" style="font-size: 5rem; margin: 15px 0;">🏆</div>
    <p id="result-desc" style="font-size: 1.3rem; margin-bottom: 25px;"></p>
    <button id="btn-back-lobby">回到遊戲大廳</button>
  </div>

  <script>
    // --- 1. CONFIG & SUPABASE INITIALIZATION ---
    const SUPABASE_URL = 'https://hzuhttxyjzktgrwsrjht.supabase.co'[cite: 3];
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VazlOgnvYhsJ79FHzvPSWw_HleXyEhk'[cite: 3];

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // --- 2. GLOBAL STATE ---
    let clientToken = localStorage.getItem('sequence_battle_client_token')[cite: 3];
    if (!clientToken) {
      clientToken = crypto.randomUUID();
      localStorage.setItem('sequence_battle_client_token', clientToken)[cite: 3];
    }

    let nickname = '';
    let currentRoomId = null;
    let currentSeat = null;
    let currentQuestion = null;
    let gameChannel = null;
    let heartbeatTimer = null;
    let opponentDisconnectTimer = null;
    let opponentWasPresent = false;
    let lastEventId = null;

    const AVATARS = ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐧', '🐸'];

    // --- 3. DOM ELEMENTS ---
    const screens = {
      login: document.getElementById('screen-login'),
      lobby: document.getElementById('screen-lobby'),
      waiting: document.getElementById('screen-waiting'),
      battle: document.getElementById('screen-battle'),
      result: document.getElementById('screen-result')
    };

    function showScreen(screenName) {
      Object.keys(screens).forEach(s => screens[s].classList.remove('active'));
      screens[screenName].classList.add('active');
    }

    // --- 4. INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', async () => {
      // Test Supabase connection
      const statusBadge = document.getElementById('connection-status');
      try {
        const { error } = await supabase.from('rooms').select('count', { count: 'exact', head: true });
        if (!error) {
          statusBadge.textContent = '資料庫已連接'[cite: 3];
          statusBadge.classList.add('connected');
        } else {
          statusBadge.textContent = '連線異常，請重新整理';
        }
      } catch (e) {
        statusBadge.textContent = '連線失敗';
      }
    });

    // Login Handler
    document.getElementById('btn-login').addEventListener('click', () => {
      const input = document.getElementById('input-nickname').value.trim();
      if (!input || input.length > 20) {
        alert('請輸入 1 至 20 字的暱稱');
        return;
      }
      nickname = input;
      document.getElementById('display-nickname').textContent = nickname;
      showScreen('lobby');
      initLobby();
    });

    // --- 5. LOBBY LOGIC ---
    let lobbyChannel = null;

    async function initLobby() {
      fetchLiveRooms();
      
      if (lobbyChannel) supabase.removeChannel(lobbyChannel);
      
      lobbyChannel = supabase.channel('public:rooms')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => {
          fetchLiveRooms();
        })
        .subscribe();
    }

    async function fetchLiveRooms() {
      const { data, error } = await supabase.rpc('list_live_rooms')[cite: 3];
      const container = document.getElementById('room-list');
      if (error || !data || data.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #888;">目前沒有等待中的房間，快來建立一個吧！</div>';
        return;
      }

      container.innerHTML = '';
      data.forEach(room => {
        const div = document.createElement('div');
        div.className = 'room-item';
        div.innerHTML = `
          <div><strong>${escapeHtml(room.host_nickname)}</strong> 的房間</div>
          <button onclick="attemptJoinRoom('${room.id}')">加入對戰</button>
        `;
        container.appendChild(div);
      });
    }

    // --- 6. CREATE & CANCEL ROOM ---
    document.getElementById('btn-create-room').addEventListener('click', async () => {
      const { data, error } = await supabase.rpc('create_room', {
        p_nickname: nickname,
        p_client_token: clientToken
      })[cite: 3];

      if (error) {
        alert('建立房間失敗：' + error.message);
        return;
      }

      currentRoomId = data.room_id;
      currentSeat = 1;
      showScreen('waiting');
      startHeartbeat();
      listenForGameStartHost();
    });

    document.getElementById('btn-cancel-room').addEventListener('click', async () => {
      await supabase.rpc('cancel_room', {
        p_room_id: currentRoomId,
        p_client_token: clientToken
      })[cite: 3];
      cleanupRoomState();
      showScreen('lobby');
      fetchLiveRooms();
    });

    function startHeartbeat() {
      stopHeartbeat();
      heartbeatTimer = setInterval(async () => {
        if (currentRoomId && currentSeat === 1) {
          await supabase.rpc('heartbeat_room', {
            p_room_id: currentRoomId,
            p_client_token: clientToken
          })[cite: 3];
        }
      }, 3000);
    }

    function stopHeartbeat() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = null;
    }

    // Host listens for game state change to "playing" or probe
    function listenForGameStartHost() {
      if (gameChannel) supabase.removeChannel(gameChannel);

      gameChannel = supabase.channel(`game-${currentRoomId}`)[cite: 3]
        .on('broadcast', { event: 'join_probe' }, ({ payload }) => {
          // Respond to Probe
          gameChannel.send({
            type: 'broadcast',
            event: 'host_ack',
            payload: { probe_id: payload.probe_id }
          });
        })
        .on('postgres_changes', { 
          event: 'UPDATE', 
          schema: 'public', 
          table: 'game_state',
          filter: `room_id=eq.${currentRoomId}`
        }, (payload) => {
          if (payload.new.status === 'playing') {
            stopHeartbeat();
            setupBattle(payload.new);
          }
        })
        .subscribe();
    }

    // --- 7. JOIN ROOM (PROBE HANDSHAKE) ---
    async function attemptJoinRoom(roomId) {
      const probeChannel = supabase.channel(`game-${roomId}`)[cite: 3];
      const probeId = crypto.randomUUID();
      let ackReceived = false;

      probeChannel.on('broadcast', { event: 'host_ack' }, ({ payload }) => {
        if (payload.probe_id === probeId) {
          ackReceived = true;
        }
      }).subscribe();

      // Wait a moment for subscription
      await new Promise(r => setTimeout(r, 300));

      // Send Join Probe
      probeChannel.send({
        type: 'broadcast',
        event: 'join_probe',
        payload: { probe_id: probeId }
      });

      // Wait 2000ms for Host ACK
      await new Promise(r => setTimeout(r, 2000));
      supabase.removeChannel(probeChannel);

      if (!ackReceived) {
        alert('房主已離開，請選其他房間。')[cite: 3];
        fetchLiveRooms();
        return;
      }

      // Proceed to Join
      const { data, error } = await supabase.rpc('join_room', {
        p_room_id: roomId,
        p_nickname: nickname,
        p_client_token: clientToken
      })[cite: 3];

      if (error) {
        if (error.message.includes('HOST_OFFLINE')) {
          alert('房主已離開，請選其他房間。')[cite: 3];
        } else {
          alert('無法加入房間：' + error.message);
        }
        fetchLiveRooms();
        return;
      }

      currentRoomId = roomId;
      currentSeat = 2;

      // Fetch initial game state and start
      const { data: gs } = await supabase.from('game_state').select('*').eq('room_id', roomId).single();
      setupBattle(gs);
    }

    // --- 8. BATTLE SETUP & REALTIME ---
    function setupBattle(initialState) {
      showScreen('battle');
      
      // Setup deterministic avatars based on roomId
      const seed = currentRoomId.replace(/-/g, '');
      const idx1 = parseInt(seed.substring(0, 2), 16) % AVATARS.length;
      let idx2 = parseInt(seed.substring(2, 4), 16) % AVATARS.length;
      if (idx1 === idx2) idx2 = (idx2 + 1) % AVATARS.length;

      // Set Avatars and Names according to seat perspective (Left = Self, Right = Opponent)
      if (currentSeat === 1) {
        document.getElementById('p1-name').textContent = initialState.player1_name || nickname;
        document.getElementById('p2-name').textContent = initialState.player2_name || '對手';
        document.getElementById('p1-avatar').textContent = AVATARS[idx1];
        document.getElementById('p2-avatar').textContent = AVATARS[idx2];
      } else {
        document.getElementById('p1-name').textContent = initialState.player2_name || nickname;
        document.getElementById('p2-name').textContent = initialState.player1_name || '房主';
        document.getElementById('p1-avatar').textContent = AVATARS[idx2];
        document.getElementById('p2-avatar').textContent = AVATARS[idx1];
      }

      updateGameStateHUD(initialState);
      generateNewQuestion();

      // Subscribe to Playing Realtime Channel
      if (gameChannel) supabase.removeChannel(gameChannel);

      opponentWasPresent = false;
      gameChannel = supabase.channel(`game-${currentRoomId}`, {
        config: { presence: { key: clientToken } }
      })[cite: 3]
      .on('postgres_changes', { 
        event: 'UPDATE', 
        schema: 'public', 
        table: 'game_state',
        filter: `room_id=eq.${currentRoomId}`
      }, (payload) => {
        handleGameStateUpdate(payload.new);
      })
      .on('presence', { event: 'sync' }, () => {
        const state = gameChannel.presenceState();
        const tokens = Object.keys(state);
        if (tokens.length >= 2) {
          opponentWasPresent = true;
          if (opponentDisconnectTimer) {
            clearTimeout(opponentDisconnectTimer);
            opponentDisconnectTimer = null;
          }
        } else if (opponentWasPresent && !opponentDisconnectTimer) {
          // Grace Period of 5s
          opponentDisconnectTimer = setTimeout(() => {
            alert('對手已斷線！')[cite: 3];
            endGameDisconnect();
          }, 5000);
        }
      })
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await gameChannel.track({ seat: currentSeat, nickname: nickname });
        }
      });
    }

    // --- 9. QUESTION GENERATOR (7th Grade Integer Addition/Subtraction) ---
    function generateNewQuestion() {
      // Generate random 1 or 2 digit integers
      const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      
      const num1 = getRandomInt(-20, 20);
      const num2 = getRandomInt(-20, 20);
      const isAddition = Math.random() > 0.5;
      
      let exprText = '';
      let correctAns = 0;

      if (isAddition) {
        exprText = `${num1} + (${num2})`;
        correctAns = num1 + num2;
      } else {
        exprText = `${num1} - (${num2})`;
        correctAns = num1 - num2;
      }

      // Format neatly
      exprText = exprText.replace(/\+\ \(\-/g, '+ (-').replace(/\-\ \(\-/g, '- (-');
      
      // Generate options
      const optionsSet = new Set([correctAns]);
      while (optionsSet.size < 4) {
        const offset = getRandomInt(-5, 5);
        if (offset !== 0) optionsSet.add(correctAns + offset);
      }

      const options = Array.from(optionsSet).sort(() => Math.random() - 0.5);

      currentQuestion = {
        text: exprText,
        options: options,
        correct: correctAns
      };

      // Render Question
      document.getElementById('question-box').innerHTML = `\\(${currentQuestion.text} = ?\\)`;
      if (window.MathJax) window.MathJax.typesetPromise();

      const btnNodes = document.querySelectorAll('.option-btn');
      options.forEach((opt, idx) => {
        btnNodes[idx].textContent = opt;
      });
    }

    // --- 10. ANSWER HANDLING & GAME LOGIC ---
    async function handleAnswer(selectedIndex) {
      if (!currentQuestion) return;
      
      const chosen = currentQuestion.options[selectedIndex];
      const isCorrect = chosen === currentQuestion.correct;

      generateNewQuestion(); // Instantly change question for smoothness

      await supabase.rpc('resolve_answer', {
        p_room_id: currentRoomId,
        p_client_token: clientToken,
        p_is_correct: isCorrect
      })[cite: 3];
    }

    function handleGameStateUpdate(gs) {
      updateGameStateHUD(gs);

      // Event Animation Flash
      if (gs.last_event_id && gs.last_event_id !== lastEventId) {
        lastEventId = gs.last_event_id;
        triggerHitAnimation();
      }

      // Check Game Over
      if (gs.status === 'finished') {
        const isWinner = (gs.winner_seat === currentSeat);
        showResult(isWinner);
      }
    }

    function updateGameStateHUD(gs) {
      let myHp = currentSeat === 1 ? gs.player1_hp : gs.player2_hp;
      let oppHp = currentSeat === 1 ? gs.player2_hp : gs.player1_hp;
      let myScore = currentSeat === 1 ? gs.player1_score : gs.player2_score;
      let oppScore = currentSeat === 1 ? gs.player2_score : gs.player1_score;

      document.getElementById('p1-hp-bar').style.width = `${(myHp / 7) * 100}%`;
      document.getElementById('p2-hp-bar').style.width = `${(oppHp / 7) * 100}%`;
      document.getElementById('p1-score').textContent = myScore;
      document.getElementById('p2-score').textContent = oppScore;
    }

    function triggerHitAnimation() {
      const card = screens.battle;
      card.classList.add('hit-anim');
      setTimeout(() => card.classList.remove('hit-anim'), 300);
    }

    // --- 11. RESULT & DISCONNECT LOGIC ---
    function showResult(isWinner) {
      showScreen('result');
      const title = document.getElementById('result-title');
      const desc = document.getElementById('result-desc');
      const avatar = document.getElementById('result-avatar');

      if (isWinner) {
        title.textContent = '🎉 勝利！';
        title.style.color = '#38a169';
        avatar.textContent = '🏆';
        desc.textContent = '太厲害了！你成功戰勝了對手！';
      } else {
        title.textContent = '💪 再接再厲！';
        title.style.color = '#e53e3e';
        avatar.textContent = '⭐';
        desc.textContent = '差一點點，下次一定能贏回來！';
      }
    }

    function endGameDisconnect() {
      showScreen('result');
      document.getElementById('result-title').textContent = '⚠️ 對手已斷線';
      document.getElementById('result-title').style.color = '#dd6b20';
      document.getElementById('result-avatar').textContent = '🔌';
      document.getElementById('result-desc').textContent = '因為對手離開了遊戲，對戰已終止。';
    }

    document.getElementById('btn-back-lobby').addEventListener('click', () => {
      cleanupRoomState();
      showScreen('lobby');
      fetchLiveRooms();
    });

    function cleanupRoomState() {
      stopHeartbeat();
      if (opponentDisconnectTimer) clearTimeout(opponentDisconnectTimer);
      opponentDisconnectTimer = null;
      if (gameChannel) supabase.removeChannel(gameChannel);
      gameChannel = null;
      currentRoomId = null;
      currentSeat = null;
      opponentWasPresent = false;
    }

    // Utilities
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Unload Page Handling
    window.addEventListener('pagehide', () => {
      if (currentRoomId && currentSeat === 1) {
        // Attempt fast cancel on exit
        navigator.sendBeacon && navigator.sendBeacon(
          `${SUPABASE_URL}/rest/v1/rpc/cancel_room`,
          JSON.stringify({ p_room_id: currentRoomId, p_client_token: clientToken })
        );
      }
    });
  </script>
</body>
</html>
